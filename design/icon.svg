<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1856"/>
      <stop offset="1" stop-color="#0e0820"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede4ff"/>
      <stop offset="1" stop-color="#b79bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#halo)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="3"/>

  <!-- speech bubble -->
  <g filter="url(#glow)">
    <path d="M150 140 h212 a46 46 0 0 1 46 46 v104 a46 46 0 0 1 -46 46 h-120 l-62 52 v-52 h-30 a46 46 0 0 1 -46 -46 v-104 a46 46 0 0 1 46 -46 z"
          fill="url(#bubble)"/>
    <!-- lines being swept away -->
    <rect x="160" y="196" width="190" height="22" rx="11" fill="#2a1856"/>
    <rect x="160" y="244" width="110" height="22" rx="11" fill="#2a1856"/>
    <circle cx="296" cy="255" r="9" fill="#2a1856" opacity="0.7"/>
    <circle cx="324" cy="255" r="6" fill="#2a1856" opacity="0.45"/>
    <circle cx="346" cy="255" r="4" fill="#2a1856" opacity="0.25"/>
  </g>

  <!-- sparkles -->
  <g fill="#f3edff" filter="url(#glow)">
    <path d="M398 92 q6 26 32 32 q-26 6 -32 32 q-6 -26 -32 -32 q26 -6 32 -32z"/>
    <path d="M110 372 q4 16 20 20 q-16 4 -20 20 q-4 -16 -20 -20 q16 -4 20 -20z" opacity="0.85"/>
  </g>
  <circle cx="420" cy="380" r="6" fill="#c4b5fd" opacity="0.8"/>
  <circle cx="96" cy="120" r="4" fill="#c4b5fd" opacity="0.7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
