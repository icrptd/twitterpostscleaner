name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and skip if already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content extension\manifest.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "$tag already released, skipping." }
          else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Install NSIS (if missing)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          Push-Location installer
          & $nsis XTweetsCleaner.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build extension zip
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath x-tweets-cleaner-extension.zip

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $exe = Get-ChildItem installer\XTweetsCleaner-Setup-*.exe | Select-Object -First 1
          $notes = @"
          ## X Tweets Cleaner $tag

          **Windows:** download ``$($exe.Name)``, run it, and follow the setup guide it opens.
          **Manual install:** download ``x-tweets-cleaner-extension.zip``, unzip it, then in ``brave://extensions`` turn on Developer mode and click **Load unpacked**.

          - Delete your replies, your posts, or both
          - Optionally undo your reposts
          - Preview mode before deleting
          - 4-second human-like pacing
          "@
          gh release create $tag $exe.FullName x-tweets-cleaner-extension.zip --title "X Tweets Cleaner $tag" --notes $notes --target $env:GITHUB_SHA
